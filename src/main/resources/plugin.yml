name: LoveChatFilter
version: "3.0"
main: me.lovelace.lovechatfilter.LoveChatFilter
api-version: '1.21'
loadbefore:
  - CMI
softdepend:
  - PlaceholderAPI
depend:
  - LoveChat
author:
  - Lovelace69
description: Продвинутый модульный фильтр чата v3.0 с SQLite.

commands:
  lcf:
    description: Основная команда плагина
    aliases: [lovechatfilter]

permissions:
  lovechatfilter.reload:
    description: Право на перезагрузку плагина
    default: op
  lovechatfilter.bypass.ads:
    description: Право на обход фильтра рекламы
    default: op
  lovechatfilter.bypass.badwords:
    description: Право на обход фильтра мата
    default: op
  lovechatfilter.bypass.caps:
    description: Право на обход фильтра капса
    default: op
  lovechatfilter.bypass.spam:
    description: Право на обход фильтра спама
    default: op