# ==========================================
#        LoveChatFilter v3.0
# ==========================================
# ПРИМЕЧАНИЕ: Если вы хотите отключить звук, сообщение или замену символов,
# просто укажите значение "NONE" (в кавычках) вместо стандартного текста.

modules:
  badwords-filter: true # Фильтр нецензурной лексики и оскорблений
  ads-filter: true # Блокировка IP-адресов и ссылок на сторонние ресурсы
  anti-caps: true # Блокировка сообщений с чрезмерным использованием ЗАГЛАВНЫХ БУКВ
  anti-spam: true # Защита от частой отправки сообщений и повторения одного и того же текста
  grammar-fix: true # Авто-исправление пунктуации и регистра (Пример: "привет. как дела?" -> "Привет. Как дела?"). Настройки игроков сохраняются в SQLite.
  goodwords-detector: true # Реакция на "хорошие" слова (например, "спасибо" или "+rep") с выполнением команд (выдача репутации/наград).
  auto-moderation: true # Сигналы для LoveBehavior: нарушения фильтра снижают вежливость, а вежливые фразы дают небольшой бонус (не требует LoveBehavior — без него сигналы просто никуда не идут)
  emptymessages-clear: true # Блокировка пустых сообщений (состоящих только из пробелов или цветовых кодов)
  # Если true - игрок видит свое сообщение уже отфильтрованным (как и все).
  # Если false - игрок видит свой оригинальный мат/текст, а остальные игроки видят отфильтрованный вариант.
  self-filter: false
grammar-allowed-commands:
  - "msg"
  - "tell"
  - "w"
  - "r"
  - "reply"
  - "me"
  - "say"
  - "broadcast"
  - "bc"
# Список команд, аргументы которых плагин НЕ будет проверять.
# Обязательно добавьте сюда команды авторизации, чтобы пароли игроков не проверялись фильтром.
ignore-commands:
  - "login"
  - "register"
  - "auth"
  - "l"
  - "reg"

badwords-filter:
  sign-filter: true # Проверять текст на табличках
  book-filter: true # Проверять текст в книгах с пером
  item-filter: true # Проверять названия предметов (при переименовании в наковальне)

  replacement-char: "👑" # Символ, на который заменяются запрещенные слова. Введите "NONE", чтобы просто вырезать мат из текста.
  sound: "ENTITY_VILLAGER_NO" # Звук, который услышит нарушитель
  full-delete-message: false # Если true, сообщение с матом не отправится вообще. Если false, отправится в чат с замененными символами (👑👑👑).

  # Список запрещенных слов. Поддерживает регулярные выражения (regex).
  # 2026-11-10: боевой список владельца (139 выражений) вместо четырёх слов. Восемь записей исправлены (помечены датой): по прогону
  # частотного словаря русского языка (100 тысяч слов) через настоящий сканер выражения «ск», «дан», «лх» ловили 6399 невинных слов
  # (сказать, москва, данные, плохо, статистика), после правки 226, почти все настоящие оскорбления. Правка: гласная обязательна
  # ([уу]+ вместо [уу]*) там, где выражение превращалось в «любые две буквы», и «с начала слова» ((?<![а-яa-z])) там, где
  # мат не бывает серединой слова. «ХУЙ» и подобные не тронуты: матом внутри слова («похуй») они и должны ловиться.
  # Существующий config.yml сервера этим файлом не заменяется: список из badwords-list.yml вставьте в свой вручную.
  list:
    # 1. ОСНОВНОЙ МАТ И ЖЕСТКИЕ ОСКОРБЛЕНИЯ
    # 2026-11-10: «хуй» оставлен простым словом из прежнего списка по умолчанию, в присланном списке его нет, а простое слово включает
    # остальные слои (латиница «xuy», опечатки) и ловит «похуй» внутри слова. «сука» простым словом не добавлена: промежутки между
    # буквами давали «нас у каждого»; её ловит выражение ниже. «блять» простым словом тоже нельзя: оно сидит внутри «употреблять»,
    # «влюбляться», «расслабляться», поэтому оно записано выражением с началом слова.
    - "хуй"
    - "(?i)(?<![а-я])б+л+я+[тд]+ь*"
    - "(?i)[bб][lл][yу][aа@4][tт]"
    - "(?i)б[л][я4][д][ии1]н[а@4]*"
    - "(?i)ш[л][юу]*х[а@4][уеи]*"
    - "(?i)ш[м][а@4]р[а@4]"
    - "(?i)ш[а@4][л][а@4][в][а@4]"
    - "(?i)д[а@4]в[а@4]л[к][а@4]"
    - "(?i)к[уу]*р[в][а@4]"
    # 2026-11-10: сука, сучка: гласная обязательна, иначе выражение ловило любое «ск» (сказать, москва).
    - "(?i)[с$][уу]+[ч]*[к][а@4иу]*"
    - "(?i)п[ии1][з][д][еи]ц"
    - "(?i)у[ееёе]б[ии1]щ[еи]"
    - "(?i)у[ееёе]б[о0]к"
    - "(?i)д[о0а@][л][б][ао][ееёе]б"
    - "(?i)п[ии1][д][о0а@][р][а@4иу]*[с$]*"
    - "(?i)г[о0][м][ии1][к][ии1]*"
    - "(?i)п[еи1][т][уу]*х[а@4]*[р][а@4]*"
    - "(?i)[п][еи1][д][ии1][к]"
    - "(?i)г[ао][н][д][о0][н]"

    # 2. УНИЖЕНИЕ ЛИЧНОСТИ И ИНТЕЛЛЕКТА
    # 2026-11-10: даун: гласная обязательна, иначе ловило любое «дан» (данные, задание).
    - "(?i)д[а@4][уу]+н"
    # 2026-11-10: аутист: гласная обязательна (статистика, шахматист больше не задеваются).
    - "(?i)[а@4][уу]+т[ии1][с$][т][к]*[а-я]*"
    - "(?i)[уу]*м[с$][т][в]*[еи]н+о\\s*[о0]т[с$][т][а@4]л[ыиеа]*"
    - "(?i)д[еи1]б[ии1]л[к]*[а-я]*"
    - "(?i)[ии1]д[ии1][о0][т][к]*[а-я]*"
    - "(?i)[т][уу]*п[о0]р[ыи]л[ыиеа]*"
    - "(?i)[т][уу]*п[ии1]ц[а@4]"
    - "(?i)г[л][уу]*п[ыиеа]*"
    # 2026-11-10: лох: с начала слова и с гласной (плохо, колхоз больше не задеваются).
    - "(?i)(?<![а-яa-z])л[о0а@]+х[а-я]*"
    - "(?i)[ч][м][о0][ш]*[н][ии1][к]*"
    - "(?i)[ч][м][ы][р][ь]"
    - "(?i)у[р][о0][д][ии1]*н*[а@4]*"
    - "(?i)[уу]*[р][о0][д][ии1][щ][еи]"
    - "(?i)[с$][к][о0][т][ии1]н[а@4]"
    - "(?i)[м][р][а@4][з][ь]*"
    # 2026-11-10: тварь: с начала слова (утварь, отвар больше не задеваются).
    - "(?i)(?<![а-яa-z])[т][в][а@4][р][ь]*"
    - "(?i)в[ы][р][о0][д][о0][к]"
    - "(?i)в[ы][б][л][я4][д][о0][к]"
    - "(?i)у[б][л][юу]*д[о0][к]"
    - "(?i)[о0][т][б][р][о0][с$]"
    - "(?i)[н][ии1][ч][т][о0][ж][еи][с$][т][в][о0]"
    - "(?i)[н][ии1]щ[еи][б][р][о0][д]"
    - "(?i)в[ы][п][еи]рд[ыи]ш[к]*[а@4]*"
    - "(?i)в[ы][с$][еи1][р][о0][к]"
    - "(?i)[о0]п[уу]*щ[еи]н+ый"
    - "(?i)[ч][уу]*ш[п][а@4][н]"
    - "(?i)м[уу]*д[ии1][л][о0а@]"
    - "(?i)быдло"
    - "(?i)лузер"
    - "(?i)у[щ][еи1][р][б][н][ыи][й]"
    - "(?i)п[о0][п][уу]*[с$][к]"

    # 3. РОДИТЕЛИ И ПОЖЕЛАНИЯ СМЕРТИ
    - "(?i)[м][а@4][м][к][ууа@4]"
    - "(?i)[м][а@4][т][ь]*\\s*[т][в][о0][юу]"
    - "(?i)[с$][ы][н]\\s*ш[л][юу]*х[ии1]"
    - "(?i)[б][еи][з][м][а@4][м][н][ыиеа]*"
    - "(?i)[м][а@4][м][еи1]\\s*пр[ии1][в][еи1][т]"
    - "(?i)[с$][уу]*[ии1]ц[ии1]д[н][ии1][с$][ь]*"
    - "(?i)[с$][п][ии1][д][о0][з][н][ыиеа]*"

    # 4. УКРАИНСКИЕ ОСКОРБЛЕНИЯ
    - "(?i)п[іи1]д[о0а@][р][а@4][с$]*"
    - "(?i)п[іи1]д[о0а@][р]"
    - "(?i)б[о0][в][д][уу]*[р]"
    - "(?i)й[о0][л][о0][п]"
    - "(?i)б[ии1][д][л][о0а@]"
    - "(?i)г[о0][в][н][о0][ї][д]"
    # 2026-11-10: сцикун: в исходной записи потерян «[», сканер её пропускал.
    - "(?i)[с$][ц][ии1][к][уу]*н"
    - "(?i)[щ][о0][б]\\s*[т][ии1]\\s*[з][д][о0][х]"

    # 5. КОНТЕКСТНЫЕ ОСКОРБЛЕНИЯ (ТЫ/ВЫ + СЛОВО)
    - "(?i)(?:т[ыы]|[в]ы|о[н]|о[н]а)\\s*[^а-я]*[к][л][о0][уу]*н"
    - "(?i)(?:т[ыы]|[в]ы|в[ые]|о[н])\\s*[^а-я]*[п][еи1][т][уу]*х[а@4]*[р][а@4]*"
    - "(?i)[п][еи1][т][уу]*х[а@4]*[р][а@4]*\\s*[^а-я]*(?:т[ыы]|[в]ы|в[ые])"
    - "(?i)(?:т[ыы]|[в]ы|в[ые])\\s*[^а-я]*(?:[о0]л[еи]н[ь]|[б][а@4]р[а@4][н]|[о0][с$][еи]л|[п][еи][с$])"
    - "(?i)(?:т[ыы]|[в]ы|в[ые])\\s*[^а-я]*(?:[с$][в][ии1][н][ь][я4]|[п][с$][ии1]н[а@4]|[г][н][ии1]д[а@4])"
    - "(?i)(?:т[ыы]|[в]ы|в[ые])\\s*[^а-я]*[т][уу]*п[ыиеа]*"
    - "(?i)(?:т[ыы]|[в]ы|в[ые])\\s*[^а-я]*г[л][уу]*п[ыиеа]*"
    - "(?i)(?:т[ыы]|[в]ы|о[н]|о[н]а)\\s*[^а-я]*(?:[о0][в][о0]щ|[б][р][еи][в][н][о0]|[д][о0][с$][к][а@4])"
    - "(?i)(?:т[ыы]|[в]ы|в[ые]|y[o0][uу])\\s*[^а-я]*[cк][lл][oо0][uу]n"
    - "(?i)(?:т[ыы]|[в]ы|в[ые])\\s+L\\b"
    - "(?i)(?:т[ыы]|[в]ы|y[o0][uу])\\s*[^а-я]*[pп][sс][ии1]н[а@4]"
    - "(?i)(?:т[ыы]|[в]ы|y[o0][uу])\\s*[^а-я]*(?:[н][о0][л][ь]|0|[l][o0][w])"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[д][еи1]б[іи1]л"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[іи1]д[іи1][о0][т]"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[п][еи1][т][уу]*х"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[г][а@4][н][д][о0][н]"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[к][л][о0][уу]*н"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іи1][н]|в[о0][н][а@4])\\s*[^а-я]*[б][а@4][р][а@4][н]"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іi][н]|в[о0][н][а@4])\\s*[^а-я]*[д][уу]*[р][еи1][н][ь]"
    - "(?i)(?:т[ии1]|[в][ии1]|в[іi][н]|в[о0][н][а@4])\\s*[^а-я]*[г][н][ии1][л][ь]"
    - "(?i)(?:т[ыи1]|[в]и[и1]|о[н]|о[н]а)\\s*[^а-я]*[б][ыи1][д][л][о0а@]"
    - "(?i)(?:т[ыи1]|[в]и[и1]|о[н]|о[н]а)\\s*[^а-я]*[л][уу]*[з][еи1][р]"

    # 6. АНГЛИЙСКИЙ / ТРАНСЛИТ / ОБХОДЫ
    # 2026-11-10: добавлена латинская «u» в [uуy]: «suka» (самая частая запись) раньше не ловилась, [уy] знал только кириллическую «у» и «y».
    - "(?i)[cs][uуy][k][a@4]"
    - "(?i)[h][уy][i][l][o0]"
    - "(?i)[p][i1][d][o0][r]"
    - "(?i)[e][b][a@4][l][o0]"
    - "(?i)[m][a@4][m][k][u]"
    - "(?i)[b][l][y][a@4]d"
    - "(?i)l[o0][s$][eи]r"
    - "(?i)b[i1]tch"
    - "(?i)a[s$][s$][h][o0][l][eи]"
    - "(?i)f[a@4]g[g]*[o0][тt]"
    - "(?i)s[t+][uу]*p[i1]d"
    - "(?i)r[eи]t[a@4]rd"

    # 7. СЛОЖНЫЕ ОБХОДЫ (СМЕСЬ СИМВОЛОВ И БУКВ)
    - "(?i)п[\\s\\.\\-\\_]*и[\\s\\.\\-\\_]*д[\\s\\.\\-\\_]*о[\\s\\.\\-\\_]*р"
    - "(?i)л[\\s\\.\\-\\_]*о[\\s\\.\\-\\_]*х"
    - "(?i)[pп][iи1!][dд][oо0][rр]"
    - "(?i)[cсs][yу][kк][aа@4]"
    - "(?i)[eе][bб][lл][aа@4][нn]"
    - "(?i)[lл][oо0][xх]"
    # 2026-11-10: чмо: с начала слова и не «чмок» (чмокнуть, чмок).
    - "(?i)(?<![а-я])[ч][mм][oо0](?!к)"
    - "(?i)[bб][lл][yу][aа@4][dд][ь]*"
    - "(?i)[bб][lл][yу][я4][д][ьт][ии1а@4][а-я]*"
    - "(?i)[pп][iи1!][dд][oо0а@][рr][а-я]*"
    - "(?i)[pп][iи1!][dд][oо0а@][р][а@4иу]*[с$]*[ыи]*"
    - "(?i)[пn][иi1][з3][дd][юy][кk][иi]*"
    - "(?i)[шsh][лl][ь]*[о0o][нn][дd][рr][а@4и]*"
    - "(?i)[пn][рr][иi1][дd][уy][рr][о0o][кk][иi1]*"
    - "(?i)[о0o][чch][кk][о0o][шsh][нn][иi1][кk][иi]*"
    - "(?i)s[l][uу][tт][s]*"
    - "(?i)c[uу][n][tт][s]*"
    - "(?i)m[o0]th[eи]rf[uу]ck[eи]r[s]*"
    - "(?i)d[i1][cк]kh[eи]ad[s]*"
    - "(?i)c[o0]cks[uу]ck[eи]r[s]*"
    - "(?i)tw[a@4]t[s]*"
    - "(?i)[вv][сc][кk][рr][о0o][йj][сc][я4]"
    - "(?i)[вv][ыi][йj][дd][иi1]\\s*[вv]\\s*[о0o][кk][нn][о0o]"
    - "(?i)[гg][лl][о0o][тt][а@4][йj]"
    - "(?i)[хx][уy][еe][сc][о0][сc][ыi]*"
    - "(?i)[xх][yу][їіиеeє][cс][оo0][cс][кk]*[а@4иiы]*"
    - "(?i)[уy][бb][лl][юy][дd][о0oкk]*[иiаa]*"
    - "(?i)[вv][иiыy][бb][лl][яy][дd][о0oкk]*[иiаa]*"
    - "(?i)[чc][лl][еe][нn][о0o][їiеe][дd][иiы]*"
    # 2026-11-10: нищий: с начала слова (днище, пристанище больше не задеваются).
    - "(?i)(?<![а-яa-z])[нn][іiи1][щshw][іiи1еe]*"
    - "(?i)[пn][о0o][мm][о0o][йj][кk][а@4иi]*"
    - "(?i)[їiєeе][бb][лl][а@4a][нn][иiыy]*"
    - "(?i)[їiєeе][бb][а@4a][нn][уy][тt][иiыy][йj]*"
    - "(?i)[хx][уy][йїіиеei1!][лl][а@4о0o][а-яa-z]*"
    - "(?i)[пp][іiи1!][дd][рr][іiи1!eе][лl][аa@4иiыy]*"
    - "(?i)[мm][уy][дd][о0o][з3z][вv][о0o][нn][а-яa-z]*"
    - "(?i)[вv][иiіыy][мm][рr][иiіыy][тtеe]*"
    - "(?i)[пp][оo0][з3z][оo0][рr][нn][аa@4ыyиiоo][а-яa-z]*"
    - "(?i)[дd][оo0][лl][бb][оo0][я][щw][еe][рp]*[аaиiуyеeя]*"
    - "(?i)[еeєёїi][бb][аa][нn][аa][тt]*[ыiиaауy]*"
    - "(?i)[їiиeеєё][бb][аa][нn][ь]*[кk][оo0]*[иiаa]*"
    - "(?i)[хx][уy][еeєё][пp][лl][еeєё][тt]*[ыiиaауy]*"
    - "(?i)[оo0][тt][сc][тt][аa][лl][ыiиy]*[йi]*[еeаaя]*"

  # Безопасные слова: невинные слова, которые НИКОГДА не считаются матом и не цензурятся, даже если
  # содержат запрещённый кусок. Добавлено 2026-10-30: фильтр ищет мат внутри слов (так ловится
  # "похуй"), поэтому обычные слова вроде "скрафтить" могли получить закрашенные 3 буквы.
  # "*" на конце = любое окончание ("скрафт*" покроет скрафтить, скрафтил, скрафтила). Минимум
  # 3 символа до "*", иначе шаблон покроет лишнее. Слова можно добавлять и из игры:
  # /lovechatfilteradmin add безопасное <слово>
  safe-words:
    - "скрафт*"
    - "крафт*"
    - "сукно*"

  # 2026-11-10: вместе с этими словами плагин применяет встроенный список (файл safe-words.txt внутри jar, около 12 тысяч слов): он
  # снят прогоном словаря русского языка через боевой список запрещённых слов и обновляется вместе с плагином, ничего не
  # записывая в config.yml и базу, поэтому ваши правки не затираются. Слова из него, которые вам НЕ нужны (например, вы хотите,
  # чтобы «нищета» или «плохо» цензурились), перечислите здесь: они перестанут считаться безопасными. Пустой список = все
  # встроенные слова действуют.
  safe-words-disabled: []

  # Команды, которые выполнятся от имени консоли при обнаружении мата.
  commands-on-detect:
    - "msg %player% Вы материтесь!"

  # Продвинутое распознавание обхода фильтра (доп. слой, включается поверх основного списка выше).
  advanced:
    enabled: true # Включить распознавание похожих латинских букв и цифр вместо букв
    homoglyph-detection: true # b -> б, p -> р, c -> с и т.д. (например "blять")
    digit-substitution-detection: true # 6 -> б, 8 -> в, 0 -> о и т.д. (например "6лять")
    fuzzy-matching: true # Допускать опечатки (например "бляат")
    compact-detection: true # Ловить слова, разбитые пробелами/знаками ("с у . к а") или растянутые повтором букв ("сууукааа") — при срабатывании только этого слоя сообщение цензурится целиком (нет точных позиций для замены одного слова)
    transliteration-detection: true # Мат латиницей ("suka", "blyat", "hui", "xuy"): слово переводится в кириллицу и сверяется со списком. Добавлено 2026-10-30: латинские буквы-двойники ловили только часть написаний.
    max-typo-distance: 1 # Максимум опечаток (вставка/удаление/замена буквы). Для слов до 4 букв опечатки не допускаются совсем (иначе "сумка" считалась бы опечаткой "сука"), 5-7 букв - 1, от 8 - 2, но не больше этого значения
    min-fuzzy-word-length: 4 # Слова короче этой длины не проверяются на опечатки (защита от ложных срабатываний)

# Сигналы для LoveBehavior (автоматическая связь мата/капса/спама и вежливых фраз с репутацией).
# LoveBehavior сам решает размер штрафа/бонуса по этим данным (see LoveBehavior config.yml).
# Работает и без LoveBehavior — события просто некому будет слушать.
auto-moderation:
  # Насколько серьёзным считается каждый тип нарушения (1 - лёгкое, 3 - тяжёлое).
  # LoveBehavior использует это число, чтобы выбрать размер штрафа из своего конфига.
  violation-severity:
    profanity: 3
    spam: 2
    caps: 1
    ads: 2
  polite-phrases:
    # Список вежливых фраз/слов. Обнаружение НЕ блокирует и НЕ меняет сообщение —
    # это чистое сканирование, дающее LoveBehavior сигнал начислить небольшой бонус.
    list:
      - "(?ui)спасибо"
      - "(?ui)пожалуйста"
      - "(?ui)благодарю"
      - "(?ui)извините"
      - "(?ui)please"
      - "(?ui)thank you"
      - "(?ui)thanks"

goodwords-detector:
  # --------------------------------------------------------
  # Настройки С ТАРГЕТОМ (когда игрок хвалит другого игрока)
  # --------------------------------------------------------
  cooldown-seconds-target: 60.0 # Задержка перед повторным использованием (в секундах)
  cooldown-message-target: "<red>Похвалить игрока %target% можно будет через {time}с!</red>"
  sound-target: "ENTITY_PLAYER_LEVELUP"
  commands-with-target:
    - "reputation add %target% 1" # Выполняется, если игрок написал, например, "Notch +rep"

  # --------------------------------------------------------
  # Настройки БЕЗ ТАРГЕТА (просто слово в чат, например "спасибо")
  # --------------------------------------------------------
  cooldown-seconds-normal: 10.0
  cooldown-message-normal: "<red>Не спамьте благодарностями! Подождите {time}с.</red>"
  sound-normal: "ENTITY_EXPERIENCE_ORB_PICKUP"
  commands-without-target:
    - "msg %player% Пожалуйста!"

  # Слова-триггеры для похвалы ( (?i) означает независимость от регистра букв )
  list:
    - "(?i)^(\\S+)\\s*\\+rep" # С таргетом: Ищет ник игрока, а затем "+rep"
    - "(?i)спасибо" # Без таргета: Реагирует на слово "спасибо" в любом месте текста

  # --------------------------------------------------------
  # ДОПОЛНИТЕЛЬНЫЙ СПИСОК (например, для понижения репутации)
  # --------------------------------------------------------
  additional-cooldown: 60.0
  additional-cooldown-message: "<red>Подождите {time}с перед этим действием!</red>"
  additional-sound: "ENTITY_ENDERMAN_TELEPORT"
  additional-commands:
    - "reputation remove %target% 1"
  additional-list:
    - "(?i)^(\\S+)\\s*\\-rep" # С таргетом (минус репутация)
    - "(?i)фу" # Без таргета

ads-filter:
  sign-filter: true # Запрещать писать рекламу на табличках
  book-filter: true # Запрещать рекламу в книгах
  item-filter: true # Запрещать переименовывать предметы в ссылки

  # Ловить точку, записанную иначе: "mysrv [.] net", "mysrv (dot) net", "mysrv точка net". Сообщение
  # цензурится целиком. Срабатывает только если дальше идёт доменная зона (ru, com, net, gg...),
  # поэтому "встретимся в точке сбора" не задевается. Добавлено 2026-10-30.
  detect-obfuscated: true

  full-delete-message: false # true = сообщение не отправится. false = ссылка заменится на символы ниже.
  replacement-char: "*" # Символ замены (например, mc.myserver.ru -> ***************)
  sound: "ENTITY_VILLAGER_NO"

  # Основные паттерны блокировки (IP адреса и доменные зоны)
  patterns:
    - '(\d{1,3}\.){3}\d{1,3}' # Ловит любые IP адреса (например 192.168.1.1)
    - '\.ru'
    - '\.com'
    - 'mc\.'
    - 'play\.'

  # Дополнительные ссылки для блокировки (Discord, Telegram и т.д.)
  extra-link-patterns:
    - 'discord\.gg'
    - 't\.me'
    - 'discordapp\.com'
    - 'youtube\.com'

  # Белый список. Ссылки и IP из этого списка не будут блокироваться!
  whitelist:
    - '127.0.0.1'
    - 'localhost'
    - '192.168.0.1'
    - 'vk.com/my_server_group' # Пример добавления своей группы ВК

  commands-on-detect:
    - "msg %player% Реклама сторонних ресурсов запрещена!"

anti-caps:
  max-caps-percent: 70 # Процент заглавных букв, при котором сообщение считается КАПСОМ (от 1 до 100)
  message: "<red>Пожалуйста, выключите Caps Lock и не пишите большими буквами!</red>"
  sound: "BLOCK_NOTE_BLOCK_BASS"
  commands-on-detect:
    - "msg %player% Вы используете капс!"

anti-spam:
  message-cooldown-seconds: 2 # Задержка между любыми разными сообщениями
  same-message-cooldown-seconds: 2 # Задержка, если игрок пишет одно и то же сообщение подряд
  # Серия одного и того же символа длиннее этого значения сокращается до него ("аааааааааа" ->
  # "ааааа", "!!!!!!!!!!" -> "!!!!!"). Сообщение не блокируется. 0 или 1 = выключено.
  # Добавлено 2026-10-30: 5 оставляет живую растяжку ("даааа"), но убирает флуд.
  max-repeated-chars: 5
  message: "<red>Не спамьте! Вы сможете написать в чат через {time} сек.</red>"
  sound: "ENTITY_VILLAGER_NO"
  commands-on-detect:
    - "msg %player% Вы слишком часто пишете в чат!"

# Фильтрация автодополнения команд (TAB) для обычных игроков
# (перенесено из LoveWebAdmin 2026-09-23 - это чат/UX-фильтрация, а не веб-администрирование)
command-tab-filter:
  enabled: true
  # 2026-11-08: полное скрытие английских команд убрано (владелец). Теперь скрываются только: команды с префиксом
  # "love" (loveauth, loveclans, ...: длинные имена плагинов; короткие алиасы auth, clan остаются видимыми),
  # служебные/админские команды (service-commands ниже, даже на английском) и команды вида плагин:команда.
  # Ключ hide-english-commands больше не читается.
  # Команды, которым разрешено отображаться в TAB несмотря на префикс love / пространство имён
  allowed-commands: []
  # Служебные и админские команды, скрытые от обычных игроков (в том числе английские). Если ключа нет, берётся
  # встроенный список (LoveEssential: npc, calamity, hologram, portal, scenario, vanish, heal, fly, gamemode...,
  # короткие алиасы админских команд, chatclear). Укажите свой список, чтобы заменить его целиком.
  # service-commands: []
  # Явный чёрный список - скрывает команду из TAB ВСЕГДА, даже если она кириллическая.
  # Добавлено 2026-09-25: владелец сервера пожаловался, что "/deluxemenus:меню" всё равно
  # показывается в автодополнении, хотя это не команда этой экосистемы, а внутренний
  # триггер стороннего плагина DeluxeMenus, у которого просто кириллическая метка -
  # правило "кириллица = своя команда" здесь не работает, а именно такой мусор владелец
  # и не хочет видеть. Сверяется и с полной меткой (с префиксом "плагин:"), и с меткой
  # без префикса - можно заблокировать конкретно версию команды от одного плагина, не
  # трогая одноимённую команду из другого. Ниже - конкретный пример из жалобы, а не
  # обязательный список: правьте под свои нужды.
  blocked-commands:
    - "deluxemenus:меню"