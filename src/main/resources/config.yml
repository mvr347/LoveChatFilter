# ==========================================
#        LoveChatFilter v3.0
# ==========================================
# ПРИМЕЧАНИЕ: Если вы хотите отключить звук, сообщение или замену символов,
# просто укажите значение "NONE" (в кавычках) вместо стандартного текста.

modules:
  badwords-filter: true # Фильтр нецензурной лексики и оскорблений
  ads-filter: true # Блокировка IP-адресов и ссылок на сторонние ресурсы
  anti-caps: true # Блокировка сообщений с чрезмерным использованием ЗАГЛАВНЫХ БУКВ
  anti-spam: true # Защита от частой отправки сообщений и повторения одного и того же текста
  grammar-fix: true # Авто-исправление пунктуации и регистра (Пример: "привет. как дела?" -> "Привет. Как дела?"). Настройки игроков сохраняются в SQLite.
  goodwords-detector: true # Реакция на "хорошие" слова (например, "спасибо" или "+rep") с выполнением команд (выдача репутации/наград).
  auto-moderation: true # Сигналы для LoveBehavior: нарушения фильтра снижают вежливость, а вежливые фразы дают небольшой бонус (не требует LoveBehavior — без него сигналы просто никуда не идут)
  emptymessages-clear: true # Блокировка пустых сообщений (состоящих только из пробелов или цветовых кодов)
  # Если true - игрок видит свое сообщение уже отфильтрованным (как и все).
  # Если false - игрок видит свой оригинальный мат/текст, а остальные игроки видят отфильтрованный вариант.
  self-filter: false
grammar-allowed-commands:
  - "msg"
  - "tell"
  - "w"
  - "r"
  - "reply"
  - "me"
  - "say"
  - "broadcast"
  - "bc"
  -
# Список команд, аргументы которых плагин НЕ будет проверять.
# Обязательно добавьте сюда команды авторизации, чтобы пароли игроков не проверялись фильтром.
ignore-commands:
  - "login"
  - "register"
  - "auth"
  - "l"
  - "reg"

badwords-filter:
  sign-filter: true # Проверять текст на табличках
  book-filter: true # Проверять текст в книгах с пером
  item-filter: true # Проверять названия предметов (при переименовании в наковальне)

  replacement-char: "👑" # Символ, на который заменяются запрещенные слова. Введите "NONE", чтобы просто вырезать мат из текста.
  sound: "ENTITY_VILLAGER_NO" # Звук, который услышит нарушитель
  full-delete-message: false # Если true, сообщение с матом не отправится вообще. Если false, отправится в чат с замененными символами (👑👑👑).

  # Список запрещенных слов. Поддерживает регулярные выражения (regex).
  list:
    - "блять"
    - "хуй"
    - "сука"
    - "пиздец"

  # Команды, которые выполнятся от имени консоли при обнаружении мата.
  commands-on-detect:
    - "msg %player% Вы материтесь!"

  # Продвинутое распознавание обхода фильтра (доп. слой, включается поверх основного списка выше).
  advanced:
    enabled: true # Включить распознавание похожих латинских букв и цифр вместо букв
    homoglyph-detection: true # b -> б, p -> р, c -> с и т.д. (например "blять")
    digit-substitution-detection: true # 6 -> б, 8 -> в, 0 -> о и т.д. (например "6лять")
    fuzzy-matching: true # Допускать опечатки (например "бляат")
    compact-detection: true # Ловить слова, разбитые пробелами/знаками ("с у . к а") или растянутые повтором букв ("сууукааа") — при срабатывании только этого слоя сообщение цензурится целиком (нет точных позиций для замены одного слова)
    max-typo-distance: 1 # Сколько "опечаток" (вставка/удаление/замена буквы) допускается
    min-fuzzy-word-length: 4 # Слова короче этой длины не проверяются на опечатки (защита от ложных срабатываний)

# Сигналы для LoveBehavior (автоматическая связь мата/капса/спама и вежливых фраз с репутацией).
# LoveBehavior сам решает размер штрафа/бонуса по этим данным (see LoveBehavior config.yml).
# Работает и без LoveBehavior — события просто некому будет слушать.
auto-moderation:
  # Насколько серьёзным считается каждый тип нарушения (1 - лёгкое, 3 - тяжёлое).
  # LoveBehavior использует это число, чтобы выбрать размер штрафа из своего конфига.
  violation-severity:
    profanity: 3
    spam: 2
    caps: 1
    ads: 2
  polite-phrases:
    # Список вежливых фраз/слов. Обнаружение НЕ блокирует и НЕ меняет сообщение —
    # это чистое сканирование, дающее LoveBehavior сигнал начислить небольшой бонус.
    list:
      - "(?ui)спасибо"
      - "(?ui)пожалуйста"
      - "(?ui)благодарю"
      - "(?ui)извините"
      - "(?ui)please"
      - "(?ui)thank you"
      - "(?ui)thanks"

goodwords-detector:
  # --------------------------------------------------------
  # Настройки С ТАРГЕТОМ (когда игрок хвалит другого игрока)
  # --------------------------------------------------------
  cooldown-seconds-target: 60.0 # Задержка перед повторным использованием (в секундах)
  cooldown-message-target: "<red>Похвалить игрока %target% можно будет через {time}с!</red>"
  sound-target: "ENTITY_PLAYER_LEVELUP"
  commands-with-target:
    - "reputation add %target% 1" # Выполняется, если игрок написал, например, "Notch +rep"

  # --------------------------------------------------------
  # Настройки БЕЗ ТАРГЕТА (просто слово в чат, например "спасибо")
  # --------------------------------------------------------
  cooldown-seconds-normal: 10.0
  cooldown-message-normal: "<red>Не спамьте благодарностями! Подождите {time}с.</red>"
  sound-normal: "ENTITY_EXPERIENCE_ORB_PICKUP"
  commands-without-target:
    - "msg %player% Пожалуйста!"

  # Слова-триггеры для похвалы ( (?i) означает независимость от регистра букв )
  list:
    - "(?i)^(\\S+)\\s*\\+rep" # С таргетом: Ищет ник игрока, а затем "+rep"
    - "(?i)спасибо" # Без таргета: Реагирует на слово "спасибо" в любом месте текста

  # --------------------------------------------------------
  # ДОПОЛНИТЕЛЬНЫЙ СПИСОК (например, для понижения репутации)
  # --------------------------------------------------------
  additional-cooldown: 60.0
  additional-cooldown-message: "<red>Подождите {time}с перед этим действием!</red>"
  additional-sound: "ENTITY_ENDERMAN_TELEPORT"
  additional-commands:
    - "reputation remove %target% 1"
  additional-list:
    - "(?i)^(\\S+)\\s*\\-rep" # С таргетом (минус репутация)
    - "(?i)фу" # Без таргета

ads-filter:
  sign-filter: true # Запрещать писать рекламу на табличках
  book-filter: true # Запрещать рекламу в книгах
  item-filter: true # Запрещать переименовывать предметы в ссылки

  full-delete-message: false # true = сообщение не отправится. false = ссылка заменится на символы ниже.
  replacement-char: "*" # Символ замены (например, mc.myserver.ru -> ***************)
  sound: "ENTITY_VILLAGER_NO"

  # Основные паттерны блокировки (IP адреса и доменные зоны)
  patterns:
    - '(\d{1,3}\.){3}\d{1,3}' # Ловит любые IP адреса (например 192.168.1.1)
    - '\.ru'
    - '\.com'
    - 'mc\.'
    - 'play\.'

  # Дополнительные ссылки для блокировки (Discord, Telegram и т.д.)
  extra-link-patterns:
    - 'discord\.gg'
    - 't\.me'
    - 'discordapp\.com'
    - 'youtube\.com'

  # Белый список. Ссылки и IP из этого списка не будут блокироваться!
  whitelist:
    - '127.0.0.1'
    - 'localhost'
    - '192.168.0.1'
    - 'vk.com/my_server_group' # Пример добавления своей группы ВК

  commands-on-detect:
    - "msg %player% Реклама сторонних ресурсов запрещена!"

anti-caps:
  max-caps-percent: 70 # Процент заглавных букв, при котором сообщение считается КАПСОМ (от 1 до 100)
  message: "<red>Пожалуйста, выключите Caps Lock и не пишите большими буквами!</red>"
  sound: "BLOCK_NOTE_BLOCK_BASS"
  commands-on-detect:
    - "msg %player% Вы используете капс!"

anti-spam:
  message-cooldown-seconds: 2 # Задержка между любыми разными сообщениями
  same-message-cooldown-seconds: 2 # Задержка, если игрок пишет одно и то же сообщение подряд
  message: "<red>Не спамьте! Вы сможете написать в чат через {time} сек.</red>"
  sound: "ENTITY_VILLAGER_NO"
  commands-on-detect:
    - "msg %player% Вы слишком часто пишете в чат!"